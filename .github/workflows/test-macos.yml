name: Test and build macOS development app
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned desktop runtime
        run: |
          npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:mac
      - name: Verify development app signature
        run: codesign --verify --deep --strict "dist/Hidden Door Vault.app"
