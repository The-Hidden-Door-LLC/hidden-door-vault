<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hidden Door Vault</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <div class="brand" id="brand-open" title="Open Hidden Door Vault">
      <img class="mark" src="img/favicon.svg" alt="" />
      <div class="brand-text">
        <div class="brand-eyebrow">THE HIDDEN DOOR</div>
        <h1>Hidden Door Vault</h1>
        <p id="status-line"><span id="status-orb" class="status-orb"></span><span id="status-text">Checking vault connection…</span></p>
      </div>
    </div>
    <div class="top-actions">
      <button id="open-app-btn" class="ghost small icon-btn" type="button" title="Open Hidden Door Vault app">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ui-icon"><path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3ZM5 5h6v2H5v12h12v-6h2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" fill="currentColor"/></svg>
        <span>App</span>
      </button>
      <button id="lock-btn" class="ghost small icon-btn" type="button" title="Lock vault" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ui-icon"><path d="M12 2a5 5 0 0 0-5 5v3H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h14a2 2 0 0 0-2-2v-8a2 2 0 0 0-2-2h-2V7a5 5 0 0 0-5-5Zm-3 5a3 3 0 1 1 6 0v3H9V7Zm3 7a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z" fill="currentColor"/></svg>
        <span>Lock</span>
      </button>
    </div>
  </header>

  <main id="main">
    <section id="unlock-panel" class="panel" hidden>
      <button id="biometric-btn" class="touchid wide icon-btn-center" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ui-icon"><path d="M12 2a9 9 0 0 0-9 9v3a1 1 0 1 0 2 0v-3a7 7 0 1 1 14 0v2.5a1.5 1.5 0 0 1-3 0V11a4 4 0 1 0-8 0v4.5a6.5 6.5 0 0 0 10.6 5.05 1 1 0 0 0-1.26-1.55A4.5 4.5 0 0 1 10 15.5V11a2 2 0 1 1 4 0v2.5a3.5 3.5 0 0 0 7 0V11a9 9 0 0 0-9-9Zm0 7a1 1 0 0 0-1 1v5.5a3.5 3.5 0 0 0 3.5 3.5 1 1 0 1 0 0-2 1.5 1.5 0 0 1-1.5-1.5V10a1 1 0 0 0-1-1Z" fill="currentColor"/></svg>
        <span id="biometric-label">Unlock with Touch ID</span>
      </button>
      <label class="field">
        <span>Master password</span>
        <input id="master-input" type="password" placeholder="Unlock Hidden Door Vault" autocomplete="off" />
      </label>
      <div class="row">
        <button id="unlock-btn" class="primary wide icon-btn-center" type="button">
          <svg viewBox="0 0 512 512" aria-hidden="true" class="ui-icon"><path d="M192 176c0-79.5 64.5-144 144-144s144 64.5 144 144-64.5 144-144 144c-11.1 0-22-1.3-32.4-3.6l-8.6-2-6.3 6.3-31.4 31.4-65.4 0 0 64-64 0 0 64-96 0 0-81.4 162.8-162.8 6.9-6.9-2.9-9.3c-4.4-13.8-6.7-28.4-6.7-43.7zM336 0c-97.2 0-176 78.8-176 176 0 15.1 1.9 29.8 5.5 43.9l-160.8 160.8-4.7 4.7 0 126.6 160 0 0-64 64 0 0-64 46.6 0 4.7-4.7 30-30c10 1.8 20.2 2.7 30.7 2.7 97.2 0 176-78.8 176-176S433.2 0 336 0zm32 168a24 24 0 1 0 0-48 24 24 0 1 0 0 48z" fill="currentColor"/></svg>
          <span id="unlock-label">Unlock vault</span>
        </button>
      </div>
    </section>

    <section id="vault-panel" hidden>
      <div class="search-row">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="search-icon"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.05l4.24 4.25-1.41 1.41-4.25-4.24A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z" fill="currentColor"/></svg>
        <input id="search-input" type="search" placeholder="Search logins for this tab or vault…" autocomplete="off" />
      </div>
      <div class="actions-bar split-actions">
        <button id="autocreate-btn" class="gen-btn flex-1" type="button" title="Generate a strong site-compatible password, fill the form, and save to Vault">
          <svg viewBox="0 0 640 512" aria-hidden="true" class="ui-icon gen-icon"><path d="M528-16l-32 0 0 64-64 0 0 32 64 0 0 64 32 0 0-64 64 0 0-32-64 0 0-64zM288 320c80.6-35.8 128.6-57.2 144-64-15.4-6.8-63.4-28.2-144-64-35.8-80.6-57.2-128.6-64-144-6.8 15.4-28.2 63.4-64 144-80.6 35.8-128.6 57.2-144 64 15.4 6.8 63.4 28.2 144 64 35.8 80.6 57.2 128.6 64 144 6.8-15.4 28.2-63.4 64-144zm-64 65.2l-34.8-78.2-5-11.2-11.2-5-78.2-34.8 78.2-34.8 11.2-5 5-11.2 34.8-78.2 34.8 78.2 5 11.2 11.2 5 78.2 34.8-78.2 34.8-11.2 5-5 11.2-34.8 78.2zM496 384l0-16-32 0 0 64-64 0 0 64 32 0 0-64 64 0 0-32-64 0 0-48z" fill="currentColor"/></svg>
          <span>Generate &amp; save</span>
        </button>
        <button id="toggle-save-btn" class="ghost small icon-btn" type="button" title="Save or update a login for this tab">
          <svg viewBox="0 0 448 512" aria-hidden="true" class="ui-icon"><path d="M240 64l0-16-32 0 0 192-192 0 0 32 192 0 0 192 32 0 0-192 192 0 0-32-192 0 0-176z" fill="currentColor"/></svg>
          <span>Save login</span>
        </button>
      </div>

      <section id="save-card" class="panel save-card" hidden>
        <div class="save-card-head">
          <span id="save-card-eyebrow" class="brand-eyebrow">SAVE LOGIN FOR THIS SITE</span>
          <button id="save-card-dismiss" class="ghost small" type="button">Dismiss</button>
        </div>
        <label class="field compact-field">
          <span>Title</span>
          <input id="save-title-input" type="text" placeholder="Site or service name" autocomplete="off" />
        </label>
        <label class="field compact-field">
          <span>Username / email</span>
          <input id="save-user-input" type="text" placeholder="you@example.com" autocomplete="off" />
        </label>
        <label class="field compact-field">
          <span>Password</span>
          <input id="save-pass-input" type="password" placeholder="Password to save" autocomplete="off" />
        </label>
        <div class="row">
          <button id="save-submit-btn" class="primary wide" type="button">Save to Vault</button>
        </div>
      </section>

      <div class="section-head">
        <span id="section-label">LOGINS</span>
        <span id="section-hint" class="section-hint">Click item to open in Vault</span>
      </div>
      <div id="items-list" class="items-list"></div>
    </section>

    <p id="toast" class="toast" hidden></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
